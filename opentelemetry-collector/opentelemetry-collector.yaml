receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics

  otlp_http/victoria-metrics:
    metrics_endpoint: http://victoria-metrics:8428/opentelemetry/v1/metrics

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        # - debug
        - otlp_grpc/jaeger
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        # - debug
        - otlp_http/prometheus
        - otlp_http/victoria-metrics
